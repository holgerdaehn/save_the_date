name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

# Ältere Läufe desselben Branches abbrechen (spart Laufzeit – bei privaten Repos zählen macOS-Minuten 10-fach).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macOS
    steps:
      - uses: actions/checkout@v7
      - name: Tests
        run: swift test
      - name: App bauen
        run: ./build.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: App bauen
        run: dotnet build Windows/SaveTheDate.csproj -c Release
      - name: Logik-Check
        run: dotnet run --project Windows/Tests/CoreCheck
